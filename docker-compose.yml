# ─────────────────────────────────────────────────────────────────────────────
# Aria Travel Agent — docker-compose.yml
#
# FOR TESTERS:
#   1. Fill in your API keys in the environment section below
#   2. Run:  docker-compose up
#   3. Open: http://localhost:8000
#
# Pull latest: docker-compose pull
# Stop:        docker-compose down
# ─────────────────────────────────────────────────────────────────────────────

version: "3.9"

services:
  aria-travel-agent:

    # ── Option A: Pull from Docker Hub (recommended for testers) ─────────────
    image: rohanz1554/aria-travel-agent:latest

    # ── Option B: Build locally from source (uncomment to use) ───────────────
    # build: .

    ports:
      - "8000:8000"

    environment:

      # ── REQUIRED — Azure OpenAI ────────────────────────────────────────────
      AZURE_OPENAI_ENDPOINT: "https://ariatravel.openai.azure.com/"
      AZURE_OPENAI_API_KEY: "2juR9hZZJMseE0ehDXrDRzw0ayFCJmjSj7NXWtYTwwgwsDD87iPSJQQJ99CCACYeBjFXJ3w3AAABACOGX6LA"
      AZURE_OPENAI_DEPLOYMENT_NAME: "gpt-5-mini"
      AZURE_OPENAI_API_VERSION: "2024-12-01-preview"

      # ── OPTIONAL — Weather (free fallback used if left blank) ──────────────
      OPENWEATHER_API_KEY: "c445b41ea5372fbca1273ca953e13f18"

      # ── OPTIONAL — Currency (free fallback used if left blank) ─────────────
      EXCHANGE_RATE_API_KEY: "541010bb4cbfa4bdfdd3c43d"

      # ── OPTIONAL — Attractions (LLM fallback used if left blank) ───────────
      OPENTRIPMAP_API_KEY: "5ae2e3f221c38a28845f05b67d3be7f89e32f13929774f3984eb6f20"

      # ── REQUIRED for PDF archiving — Azure Blob Storage ───────────────────
      # Get from: portal.azure.com → Storage account → Access keys
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=ariastorage0;AccountKey=HmLzSF2Z+23PPmHtThai+C/md+JUkl/oqKbpNnjcrRFyIYroahD2FAFFmBC3W1jdeyFo0hRaNXOf+AStkt69bA==;EndpointSuffix=core.windows.net"
      AZURE_STORAGE_CONTAINER_NAME: "ariaqueries"

      # ── REQUIRED for email — choose gmail / outlook / sendgrid ─────────────
      EMAIL_PROVIDER: "gmail"
      EMAIL_SENDER_ADDRESS: "rohanzunjruk.aress@gmail.com"
      # Gmail: use 16-char App Password from myaccount.google.com → Security
      EMAIL_SENDER_PASSWORD: "ggtj aedq iamc xfwm"

      # ── SendGrid alternative (uncomment + set EMAIL_PROVIDER=sendgrid) ─────
      # EMAIL_PROVIDER: "sendgrid"
      # SENDGRID_API_KEY: "SG.xxxxxxxxxxxxxxxx"
      # EMAIL_SENDER_ADDRESS: "your-verified@example.com"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s