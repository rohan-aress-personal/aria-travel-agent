name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOCKER_IMAGE: rohanz1554/aria-travel-agent

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t rohanz1554/aria-travel-agent:latest -t rohanz1554/aria-travel-agent:${{ github.sha }} .

      - name: Push Docker Image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push rohanz1554/aria-travel-agent:latest
          docker push rohanz1554/aria-travel-agent:${{ github.sha }}